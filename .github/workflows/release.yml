name: Release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar pnpm
        run: npm install -g pnpm@12

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Caché de compilación de Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar, firmar y crear la release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Sailock v${{ github.ref_name }}"
          releaseBody: "Download the Windows installer below. If you already run Sailock 2.0.0 or later, the app will let you know about this version."
          releaseDraft: true
          prerelease: false
name: Documentation
description: Something in the README, release notes, or other docs is missing, unclear, or wrong
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes:
      label: Where is the problem?
      placeholder: e.g. README "Getting Started" section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's missing, unclear, or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)
    validations:
      required: false
